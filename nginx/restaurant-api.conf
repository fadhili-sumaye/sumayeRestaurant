# =========================================================
# Nginx Configuration: Restaurant Management API
# File: /etc/nginx/sites-available/restaurant-api
#
# This configuration handles:
#   1. HTTP → HTTPS redirect (port 80 → 443)
#   2. REST API proxying (/api/) → Spring Boot :8080
#   3. WebSocket/STOMP upgrading (/ws) → Spring Boot :8080
#   4. SSL termination (via Let's Encrypt / Certbot)
# =========================================================

# Redirect all plain HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.yourdomain.com;

    # -------------------------------------------------------
    # SSL Certificates (managed by Certbot / Let's Encrypt)
    # These paths are set automatically by: certbot --nginx
    # -------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # -------------------------------------------------------
    # Security Headers
    # -------------------------------------------------------
    add_header X-Frame-Options          "SAMEORIGIN"    always;
    add_header X-Content-Type-Options   "nosniff"       always;
    add_header X-XSS-Protection         "1; mode=block" always;
    add_header Referrer-Policy          "no-referrer"   always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # -------------------------------------------------------
    # WebSocket / STOMP Proxy
    # Android OkHttp STOMP connects to /ws
    # -------------------------------------------------------
    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # WebSocket upgrade headers
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        # Long timeouts for persistent WebSocket connections
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_connect_timeout 10s;
    }

    # -------------------------------------------------------
    # REST API Proxy
    # All /api/* requests go to Spring Boot on port 8080
    # -------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header Connection         "";

        proxy_read_timeout  30s;
        proxy_send_timeout  30s;
        proxy_connect_timeout 5s;

        # File upload support (matches multipart config in Spring)
        client_max_body_size 15M;
    }

    # -------------------------------------------------------
    # Static food images (cached by Nginx, 30 days)
    # -------------------------------------------------------
    location /images/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_cache_valid 200 30d;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # -------------------------------------------------------
    # Block direct root access (only /api and /ws are public)
    # -------------------------------------------------------
    location / {
        return 404;
    }
}
