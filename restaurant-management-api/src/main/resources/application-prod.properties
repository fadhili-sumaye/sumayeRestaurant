# ===================================================================
# PRODUCTION PROFILE CONFIGURATION (Cloud Hosting: Render + Aiven MySQL)
# All sensitive settings MUST be provided via Environment Variables
# ===================================================================

# ------------------------------------------------------------------
# Aiven MySQL Connection
# ------------------------------------------------------------------
# SSL modes (MySQL Connector/J sslMode values):
#   DISABLED  -> plaintext only (never use with Aiven in production)
#   PREFERRED -> try TLS, fall back to plaintext
#   REQUIRED  -> TLS required, but does NOT verify the server certificate
#   VERIFY_CA -> TLS required AND verifies server cert against our CA  (RECOMMENDED)
#
# DB_HOST / DB_PORT / DB_NAME / DB_USERNAME / DB_PASSWORD  are injected
# by Render as environment variables. No credentials live in source code.
#
# When DB_SSL_MODE=VERIFY_CA the Connector/J will look for a property
# named "sslRootCert" that points to a PEM trust file we bundle in the image.
# ------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:restaurant_management}?useSSL=${DB_USE_SSL:true}&requireSSL=${DB_REQUIRE_SSL:true}&sslMode=${DB_SSL_MODE:VERIFY_CA}&sslRootCert=${DB_SSL_ROOT_CERT:classpath:aiven-ca.pem}&verifyServerCertificate=${DB_VERIFY_SERVER_CERT:true}&allowPublicKeyRetrieval=false&serverTimezone=Africa/Dar_es_Salaam&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool
# Aiven free MySQL has a small connection limit and Render free gives 512 MB RAM.
# Keep the pool small so a single free instance never exhausts server connections
# or the JVM heap. Tune via DB_POOL_MAX_SIZE / DB_POOL_MIN_IDLE / DB_POOL_MAX_LIFETIME_MS.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}

# Tomcat Thread & Connection Pool (support several simultaneous Android clients,
# while staying inside Render free 512 MB RAM budget. Single app instance.)
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=5
server.tomcat.accept-count=25
server.tomcat.connection-timeout=20000

# JPA / Hibernate for Production (update schema safely, configurable via SPRING_JPA_HIBERNATE_DDL_AUTO)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Production Logging (Safe: no sensitive parameters, tokens, or queries logged)
logging.level.root=INFO
logging.level.com.sumaye.restaurant=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=ERROR
