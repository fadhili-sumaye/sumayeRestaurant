# ===================================================================
# BASE APPLICATION CONFIGURATION
# Active profile is controlled by SPRING_PROFILES_ACTIVE environment variable (defaults to 'dev')
# ===================================================================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Application Info
spring.application.name=restaurant-management-api

# Server common settings
server.address=0.0.0.0
# Render injects the dynamic PORT env var in production; fall back to SERVER_PORT/8080 for local dev
server.port=${PORT:${SERVER_PORT:8080}}

# File Upload limits
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Matching strategy
spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER

# Jackson serialization
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=Africa/Dar_es_Salaam
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.fail-on-empty-beans=false

# JWT Default Configuration (can be overridden via environment variables)
jwt.secret=${JWT_SECRET:ThisIsAVeryLongSecretKeyThatShouldBeAtLeast32CharactersForHS256Algorithm}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS & WebSocket Allowed Origins
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080,http://10.0.2.2:8080,http://192.168.1.25:8080,http://192.168.118.71:8080,*}
ws.allowed-origins=${WS_ALLOWED_ORIGINS:*}
